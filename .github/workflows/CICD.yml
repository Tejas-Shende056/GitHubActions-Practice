    runs-on: ubuntu-latest
    steps:
      - name: cloning the code
        run: echo "Cloning code"
      
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build using docker
        run: echo "builfing using docker"
        
  test:
